[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-stem-opportunities"
version = "0.1.0"
description = "Automation scripts for curating STEM opportunities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "amanda-yin-x"}
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.scripts]
stem-opps = "scripts.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

name: Weekly Opportunity Discovery

on:
  schedule:
    # Run every Sunday at 8 AM UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        id: scrape
        run: |
          python -m scripts.main scrape --sources google-linkedin,web
          echo "NEW_COUNT=$(wc -l < data/opportunities.csv)" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Verify new entries
        run: python -m scripts.main verify --new-only
        continue-on-error: true

      - name: Regenerate README
        run: python -m scripts.main generate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: automated opportunity discovery"
          title: "feat: new opportunities discovered"
          body: |
            ## Automated Discovery Run

            This PR contains opportunities discovered by the automated scraping pipeline.

            ### Review Checklist

            Before merging, please verify:
            - [ ] Deadlines are accurate (check official sources)
            - [ ] Eligibility requirements are correct
            - [ ] Compensation details are accurate
            - [ ] No duplicates or spam entries
            - [ ] All URLs are working

            ---

            *This PR was auto-generated. Please review carefully before merging.*
          branch: auto/weekly-discovery
          labels: |
            automated
            needs-review
          delete-branch: true

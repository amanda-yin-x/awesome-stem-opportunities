name: Daily Link Verification

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  verify-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CSV first
        run: python -m scripts.main validate

      - name: Verify all links
        run: python -m scripts.main verify
        continue-on-error: true

      - name: Regenerate README
        run: python -m scripts.main generate

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.csv README.md
          git diff --staged --quiet || git commit -m "chore: daily verification update"
          git push
